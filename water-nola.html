<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ওয়াটার নলা</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:900px;background:white;border-radius:24px;padding:40px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.badge{display:inline-block;background:#e8f4ff;color:#0877d1;padding:8px 16px;border-radius:30px;font-weight:bold}
h1{font-size:clamp(36px,8vw,60px);margin:18px 0 12px}
p{font-size:19px;line-height:1.7;color:#5b6472;max-width:650px;margin:0 auto 25px}
.product{margin:20px auto 28px;max-width:520px;padding:55px 20px;border-radius:18px;background:#eef6fb;font-size:25px;font-weight:bold}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{padding:14px 25px;border-radius:12px;font-weight:bold;font-size:17px;text-decoration:none}
.primary{background:#1683d8;color:white}.secondary{border:2px solid #1683d8;color:#1683d8}
.note{font-size:14px;color:#7a8492;margin-top:22px}
</style>
</head>
<body>
<main><section class="card">
<div class="badge">বিশেষ অফার</div>
<h1>ওয়াটার নলা</h1>
<p>মানসম্মত ওয়াটার নলা আপনার প্রয়োজন অনুযায়ী সহজে অর্ডার করুন।</p>
<div class="product">আপনার পণ্যের ছবি এখানে যোগ করুন</div>
<div class="buttons">
<a class="primary" href="tel:+8801XXXXXXXXX">অর্ডার করুন</a>
<a class="secondary" href="https://wa.me/8801XXXXXXXXX">WhatsApp</a>
</div>
<div class="note">ফোন নম্বর পরিবর্তন করতে HTML-এর tel ও wa.me লিংকটি এডিট করুন।</div>
</section></main>
</body>
</html>
